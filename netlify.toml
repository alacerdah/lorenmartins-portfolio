[build]
  command = "npm run build"
  publish = "dist"

# o package.json exige Node >= 22.12; sem isso o Netlify usa a versão padrão dele
[build.environment]
  NODE_VERSION = "22"

# a página de links virou a inicial; o endereço antigo continua funcionando
[[redirects]]
  from = "/links"
  to = "/"
  status = 301

# o mídia kit virou uma seção do portfólio
[[redirects]]
  from = "/midia-kit"
  to = "/portfolio#midia-kit"
  status = 301
